<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Todo App</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <main class="container">

        <h1>Todo App</h1>


        <section id="authSection">

            <div class="auth-card">

                <h2 id="authTitle">Login</h2>

                <form id="loginForm">

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>


                <form id="registerForm" class="hidden">

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Username"
                        required
                    >

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Register
                    </button>

                </form>

                <p id="authMessage"></p>

                <button
                    id="toggleAuth"
                    type="button"
                >
                    Create an account
                </button>

            </div>

        </section>


        <section id="todoSection" class="hidden">

            <div class="todo-header">

                <h2>Your Todos</h2>

                <button id="logoutButton">
                    Logout
                </button>

            </div>


            <form id="formSubmit">

                <input
                    type="text"
                    id="task"
                    placeholder="Enter a task"
                    required
                >

                <input
                    type="submit"
                    value="Add Task"
                >

            </form>

            <p id="todoMessage"></p>

            <div id="todos"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
